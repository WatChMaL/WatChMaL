epochs: 5
val_interval: 3
checkpointing: false

# Diagnostics run via the optional `diagnostic_multiring` submodule. Leave empty
# to train without it; populate (and init the submodule) to produce plots, e.g.
# ["event_display", "dice_vs_angle", "ring_count_confusion", "charge_profile_mean"]
diagnostic:
  enabled: []
  out_dir: "img"

data_loaders:
  train:
    batch_size: 128
    num_workers: 2
    split: 0.5
    cache_refresh_epochs: 20

  validation:
    batch_size: 128
    num_workers: 0

# loss and scheduler are composed from tutorial/config/caverns/loss/ and
# tutorial/config/caverns/scheduler/ in multiring_segmentation_train.yaml's defaults.
