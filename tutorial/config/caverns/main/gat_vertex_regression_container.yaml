# Container variant of gat_vertex_regression.yaml — VanillaGAT vertex regression, but
# pointing at the "_container" dataset config (paths matching
# tutorial/launch/caverns/container/run_in_container.sh's binds) instead of the host-path one.
#
# Launch (same pattern as the other examples: --config-path points at main/, and
# hydra.searchpath adds the tutorial/config/caverns root so the group defaults resolve):
#   python main.py \
#       --config-path /ABS/PATH/TO/tutorial/config/caverns/main --config-name gat_vertex_regression_container \
#       hydra.searchpath=[/ABS/PATH/TO/tutorial/config/caverns]
# Dataset paths (split_path + graph_folder_path) are set in
#   tutorial/config/caverns/data/dataset/20inch_pmt_knn5_vertex_regression_container.yaml

MASTER_PORT: 12357
core: caverns
find_unused_parameters: True  # graph/MR models can leave params unused each forward; opt in explicitly
seed: 1234

# Fully deterministic mode: same config + same seed -> identical numbers on this
# machine (deterministic kernels only, no cuDNN autotuning, python/numpy RNGs seeded).
# Costs some speed, and raises if an op has no deterministic implementation - set
# deterministic_warn_only: True to downgrade that to a warning. See
# watchmal/utils/determinism.py.
deterministic: False
gpu_list: []  # Set to [0, 1, ...] to use specific GPUs

kind: gnn
launch_wandb: False  # Set to True if you want to use wandb logging

defaults:
    # Wandb configuration (only used if launch_wandb: True)
    - wandb: tutorial
    - model: vanilla_gat_vertex_regressor
    
    - engine: gnn_regressor
    
    # Dataset configuration - using the container tutorial dataset config
    - data/dataset@data.dataset: 20inch_pmt_knn5_vertex_regression_container
    - data/transforms@data.transforms: 20inch_pmt_vertex_regression
    
    # Training configuration
    - tasks/train: gnn_train
    - sampler@tasks.train.data_loaders.train.sampler_config: subset_random
    - sampler@tasks.train.data_loaders.validation.sampler_config: subset_sequential
    
    - loss@tasks.train.loss: mse
    - optimizers@tasks.train.optimizers: adam
    
    - scheduler@tasks.train.scheduler: reduce_lr_on_plateau
    - scheduler@tasks.train.early_stopping: early_stopping
    
    - tasks/restore_best_state: restore_best
    
    # Evaluation configuration
    - tasks/evaluate: gnn_evaluate
    - sampler@tasks.evaluate.data_loaders.test.sampler_config: subset_sequential
    - loss@tasks.evaluate.loss: mse
    
    - _self_
