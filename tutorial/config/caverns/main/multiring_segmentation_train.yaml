# Multi-ring segmentation training (sparse 3D U-Net + query-transformer head).
#
# Launch (same pattern as tutorial/launch/caverns/run_main_cclyon.sh: --config-path points at
# main/, and hydra.searchpath adds the tutorial/config/caverns root so the group defaults below
# resolve). Set your dataset path:
#   python main.py \
#       --config-path /ABS/PATH/TO/tutorial/config/caverns/main --config-name multiring_segmentation_train \
#       hydra.searchpath=[/ABS/PATH/TO/tutorial/config/caverns] \
#       data.dataset.params.base_dir=/path/to/your/multiring_dataset
#
# For a quick smoke test: add  tasks.train.epochs=1 data.dataset.params.num_batches=1
MASTER_PORT: 12357
core: caverns
find_unused_parameters: True  # graph/MR models can leave params unused each forward; opt in explicitly
gpu_list: [0]
kind: cnn
seed: 5

# Fully deterministic mode: same config + same seed -> identical numbers on this
# machine (deterministic kernels only, no cuDNN autotuning, python/numpy RNGs seeded).
# Costs some speed, and raises if an op has no deterministic implementation - set
# deterministic_warn_only: True to downgrade that to a warning. See
# watchmal/utils/determinism.py.
deterministic: False
launch_wandb: true

defaults:
  - engine: multiring/segmentation
  - data/multiring@data: sparse_dataset
  - model/multiring@model: segmentation_model
  - tasks/train/multiring@tasks.train: multiring_seg
  - loss@tasks.train.loss: set_ce_dice
  - scheduler@tasks.train.scheduler: cosine_annealing
  - optimizers@tasks.train.optimizers: adam_amsgrad
  - wandb@wandb: multiring
  - _self_
